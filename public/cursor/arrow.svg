<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Outer 3D border gradient -->
    <linearGradient id="arrowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80C3F8" />
      <stop offset="35%" stop-color="#4A90D0" />
      <stop offset="100%" stop-color="#2A67A3" />
    </linearGradient>

    <!-- Inner dark navy vertical/diagonal gradient -->
    <linearGradient id="arrowBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#062963" />
      <stop offset="50%" stop-color="#0E3067" />
      <stop offset="100%" stop-color="#1C3A6B" />
    </linearGradient>

    <!-- Top glossy specular reflection -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#80C3F8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4A90D0" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="arrowShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#020C1F" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#arrowShadow)">
    <!-- Outer Beveled Rim -->
    <path
      d="M 6.5 4.5
         C 5.5 3.5 3.8 4.2 4.2 5.8
         L 19.5 50.5
         C 20.0 52.0 22.0 52.2 22.8 50.8
         L 31.2 36.8
         L 46.5 49.5
         C 47.8 50.5 49.8 49.8 50.2 48.2
         L 53.5 35.5
         C 53.8 34.0 52.8 32.6 51.3 32.2
         L 36.0 27.5
         L 46.2 16.5
         C 47.2 15.4 46.5 13.5 45.0 13.2
         Z"
      fill="url(#arrowBorder)"
      stroke="#1E4D82"
      stroke-width="0.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Dark Navy Core -->
    <path
      d="M 8.2 8.0
         L 21.0 45.2
         L 29.0 32.5
         C 29.5 31.7 30.5 31.3 31.5 31.6
         L 45.0 35.8
         L 41.5 20.2
         C 41.2 19.2 41.6 18.2 42.4 17.5
         L 39.5 14.5
         Z"
      fill="url(#arrowBody)"
    />

    <!-- Glossy Specular Highlight Curve -->
    <path
      d="M 6.5 4.5
         L 45.0 13.2
         L 36.0 27.5"
      stroke="url(#specularGlow)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
